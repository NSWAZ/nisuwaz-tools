<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>니수와즈 도구 조각모음</title>
<meta name="description" content="EVE Online 한국 플레이어를 위한 계산 도구 모음: 냉장고 계산기, PLEX 현질 효율 계산기.">
<style>
/* 배치: 가운데 좁은 기둥 하나 — 사이트 이름, 한 줄 소개, 아이콘 칸 격자, 저작권 문구. 아이콘이 주인공 */
:root{
  color-scheme:dark;
  --bg:#0b0f14; --surface:#121922; --fg:#e6edf3; --muted:#9aa6b2; --faint:#6b7682;
  --line:#243041; --tile:#162536; --focus:#58a6ff;
  --f:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.6 var(--f);-webkit-font-smoothing:antialiased;
  padding-block:clamp(40px,10vh,96px) 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;display:grid;gap:40px}
header{display:grid;gap:6px;text-align:center}
h1{margin:0;font-size:clamp(24px,5vw,32px);line-height:1.25;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted)}
.tools{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.tool{display:grid;justify-items:center;align-content:start;gap:10px;padding:20px 12px 18px;text-align:center;
  color:inherit;text-decoration:none;border:1px solid transparent;border-radius:16px}
.tool:hover{background:var(--surface);border-color:var(--line)}
.tool:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tool img{display:block;width:120px;height:120px;max-width:100%;border-radius:26px;background:var(--tile)}
.tool b{font-size:17px;line-height:1.35}
.tool span{font-size:13px;color:var(--muted);line-height:1.5;max-width:30ch;word-break:keep-all;text-wrap:balance}
footer{color:var(--faint);font-size:12px;text-align:center;line-height:1.8}
footer a{color:var(--muted)}
@media (max-width:420px){.tool img{width:96px;height:96px;border-radius:21px}}
@media (prefers-reduced-motion:no-preference){.tool{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<main>
  <header>
    <h1>니수와즈 도구 조각모음</h1>
    <p>EVE 하면서 자주 하는 계산, 한국어로 빠르게.</p>
  </header>

  <ul class="tools">
    <li><a class="tool" href="/fridge">
      <img src="/icons/fridge.png" alt="" width="120" height="120">
      <b>냉장고 계산기</b>
      <span>피팅 × 척수 − 보유 = 지타에서 살 것</span>
    </a></li>
    <li><a class="tool" href="/plex">
      <img src="/icons/plex.png" alt="" width="120" height="120">
      <b>PLEX 현질 효율 계산기</b>
      <span>바로 팔기 vs 오메가+MCT 스킬팜</span>
    </a></li>
  </ul>

  <footer>
    로그인 없음 · 공개 시세만 사용 · <a href="https://nisuwaz.com">nisuwaz.com</a><br>
    EVE Online 관련 자료와 이름은 CCP hf.의 저작물입니다.
  </footer>
</main>
</body>
</html>
